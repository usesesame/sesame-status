owner: usesesame
repo: sesame-status

sites:
  - name: Website
    url: https://usesesame.app
  - name: API
    url: https://api.usesesame.app/v1/product/status
  - name: Account portal
    url: https://account.usesesame.app
  - name: Mail relay
    url: mail.usesesame.app
    port: 587
    check: tcp-ping

status-website:
  cname: status.usesesame.app
  name: Sesame Status
  introTitle: Sesame status
  introMessage: >-
    Availability of the Sesame website, API, account portal, and mail relay.
    These checks run on GitHub Actions rather than on the server they watch, so
    this page stays up when that server does not.
  navbar:
    - title: Status
      href: /
    - title: Sesame
      href: https://usesesame.app
    - title: Source
      href: https://github.com/usesesame
  themeMode: dark
  logoUrl: https://usesesame.app/favicon.svg
  favicon: https://usesesame.app/favicon.svg

# The administration console is deliberately absent. It is noindex, unlinked,
# and a public status page confirming it exists and is reachable helps nobody
# except someone looking for it.

assignees:
  - d0mkaaa
